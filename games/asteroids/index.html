<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ASTEROIDS · ARCADEBASE</title>
  <link rel="stylesheet" href="../../shared/styles.css">
  <style>
    .game-page {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; min-height: 100vh;
      background: var(--bg-dark);
      position: relative;
    }
    .controls {
      display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
      justify-content: center; padding: 0 8px;
    }
    .ctrl-btn {
      font-family: "Press Start 2P", monospace;
      font-size: 14px; min-width: 60px; min-height: 52px;
      padding: 8px 10px; border: 2px solid #444; border-radius: 8px;
      background: #111; color: var(--neon-cyan);
      cursor: pointer; user-select: none;
      -webkit-user-select: none; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.1s;
      line-height: 1;
    }
    .ctrl-btn:active, .ctrl-btn.active {
      border-color: var(--neon-pink); color: var(--neon-pink);
      box-shadow: 0 0 12px rgba(255,0,110,0.5);
      background: #1a1a1a;
    }
    .ctrl-btn.fire-btn {
      min-width: 80px; font-size: 18px;
    }
    .ctrl-label {
      font-size: 7px; color: #666; text-align: center;
      margin-top: 4px; margin-bottom: 8px;
      font-family: "Press Start 2P", monospace;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="game-page">
    <a href="../../index.html" class="back-link">← BACK</a>
    <div class="game-container" id="game-container">
      <div class="canvas-wrapper" id="canvas-wrapper"></div>
    </div>
    <div class="ctrl-label">— CONTROLS —</div>
    <div class="controls" id="controls-bar">
      <button class="ctrl-btn" id="btn-rotl" title="Rotate Left">↺</button>
      <button class="ctrl-btn" id="btn-rotr" title="Rotate Right">↻</button>
      <button class="ctrl-btn" id="btn-thrust" title="Thrust">▲</button>
      <button class="ctrl-btn fire-btn" id="btn-fire" title="Fire">🔫</button>
    </div>
  </div>
  <script src="../../shared/utils.js"></script>
  <script src="../../shared/game-base.js"></script>
  <script src="game.js"></script>
</body>
</html>
